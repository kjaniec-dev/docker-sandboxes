schemaVersion: "1"

args:
  skillsPath:
    description: Agent-specific destination for the native shared skills store
  workspace:
    required: true
    description: Absolute path of the Git repository mounted as the writable workspace

workspace: "${{ env.args.workspace }}"

sandboxOptions:
  pullPolicy: always
  skills: readonly

kits:
  - source: ../mixins/dev
    args:
      skillsPath: "${{ env.args.skillsPath }}"

# Context7 is host-registered with native `sbx mcp add` and attached by
# bin/sbx-dev (and tests/smoke.sh) using `sbx mcp load`.
# Do not redeclare it here: SBX 0.51.0 can reject a host-global registration
# of the same name with a different definition (for example OAuth metadata).
