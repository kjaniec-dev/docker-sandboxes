schemaVersion: "1"
agent: junie
args:
  skillsPath:
    default: /home/agent/.junie/skills

kits:
  # Official sbx workload 26.9.21, resolved 2026-11-07.
  - docker.io/sbx/junie@sha256:e5e4c0a94b9e859d979641af4a7dc001b584fa0a2bd6cc4e898298f54b7d8e36
  - source: ../../workloads/junie-dev

env:
  SBX_AGENT_KIND: junie
  # Junie's JVM ignores HTTP_PROXY; SBX's local proxy endpoint is stable.
  # Native environment inheritance also covers Junie installation and self-updates.
  JAVA_TOOL_OPTIONS: >-
    -Djavax.net.ssl.trustStore=/opt/sbx-dev/java/lib/security/cacerts
    -Dhttp.proxyHost=gateway.docker.internal -Dhttp.proxyPort=3128
    -Dhttps.proxyHost=gateway.docker.internal -Dhttps.proxyPort=3128
