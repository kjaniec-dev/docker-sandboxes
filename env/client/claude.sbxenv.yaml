schemaVersion: "1"
agent: claude-dev

args:
  skillsPath:
    default: /home/agent/.claude/skills
  vertexProject:
    required: true
    description: Google Cloud project containing Vertex AI access
  vertexRegion:
    required: true
    description: Vertex AI region approved for the client

kits:
  - ../../workloads/claude-dev
  # Official 2.1.292 resolved 2026-10-15; newer than the latest tag's 2.1.291.
  - docker/sbx-kit-claude-mixin@sha256:38797566d13559dd8388409a557aba5820fa2adc50fbc6497cba4be2649d41b4
  - ../../mixins/vertex

env:
  SBX_AGENT_KIND: claude
  CLAUDE_CODE_USE_VERTEX: "1"
  CLAUDE_CODE_SKIP_VERTEX_AUTH: "1"
  ANTHROPIC_VERTEX_PROJECT_ID: "${{ env.args.vertexProject }}"
  CLOUD_ML_REGION: "${{ env.args.vertexRegion }}"
