# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: KJ Dev Environment
description: Shared full-stack, architecture and DevOps tooling and instructions.
kind: mixin
version: "1.0.0"

provides:
  - kj-dev@1.0.0
  - serena
  - playwright-cli
  - java25

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # Git / GitHub and release assets.
          - github.com:443
          - api.github.com:443
          - raw.githubusercontent.com:443
          - objects.githubusercontent.com:443
          - codeload.github.com:443
          - release-assets.githubusercontent.com:443
          - "*.githubusercontent.com:443"

          # JavaScript / Node.
          - registry.npmjs.org:443
          - nodejs.org:443

          # Go modules and vulnerability data.
          - go.dev:443
          - proxy.golang.org:443
          - sum.golang.org:443
          - storage.googleapis.com:443
          - vuln.go.dev:443
          - api.osv.dev:443

          # Python / uv.
          - pypi.org:443
          - files.pythonhosted.org:443
          - astral.sh:443

          # Maven / Gradle.
          - repo1.maven.org:443
          - repo.maven.apache.org:443
          - plugins.gradle.org:443
          - services.gradle.org:443

          # Browser automation downloads and common package mirrors.
          - cdn.playwright.dev:443
          - playwright.download.prss.microsoft.com:443
          - archive.ubuntu.com:443
          - security.ubuntu.com:443
          - ports.ubuntu.com:443
          - download.docker.com:443

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: python3 /usr/local/lib/sbx-dev/configure-agent.py
          user: agent
          env: [SBX_AGENT_KIND, MCP_GATEWAY_URL, MCP_SENTINEL_TOKEN_NAME]
          description: Configure sandbox-local Serena MCP and gateway fallback
      startup:
        - command: python3 /usr/local/lib/sbx-dev/configure-agent.py
          user: agent
          env: [SBX_AGENT_KIND, MCP_GATEWAY_URL, MCP_SENTINEL_TOKEN_NAME]
          description: Reconcile sandbox-local MCP configuration after agent startup hooks

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./dev-context.md
