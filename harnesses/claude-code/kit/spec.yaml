schemaVersion: "2"
kind: sandbox
name: claude-sbx-private
version: "1.0.0"
displayName: Claude SBX Private
description: Private development defaults for Claude Code in Docker Sandboxes

extends: claude

args:
  harness_root:
    required: true
  skills_root:
    required: true

environment:
  variables:
    HARNESS_ROOT: ${{ kit.args.harness_root }}
    SHARED_SKILLS_ROOT: ${{ kit.args.skills_root }}

setup:
  install:
    - command: 'bash "$HARNESS_ROOT/harnesses/claude-code/scripts/bootstrap.sh"'
      user: "1000"
      description: Configure integrations and shared skills

permissions:
  network:
    allow:
      - github.com
      - api.github.com
      - raw.githubusercontent.com
      - objects.githubusercontent.com
      - codeload.github.com
      - registry.npmjs.org
      - nodejs.org
      - go.dev
      - proxy.golang.org
      - sum.golang.org
      - pypi.org
      - files.pythonhosted.org
      - astral.sh
      - mcp.context7.com
      - cdn.playwright.dev
      - playwright.download.prss.microsoft.com

agentInstructions:
  filename: CLAUDE.md
  content: |
    This sandbox directly mounts the host Git repository read/write.

    Worktree rules:
    - Use project-local `.worktrees/`.
    - Verify `.worktrees/` is ignored by Git before creating a worktree.
    - Prefer native worktree capability when available; otherwise use `git worktree`.
    - Never create a sibling worktree outside the mounted repository.
    - When switching into a worktree, activate that worktree path in Serena before semantic reads or edits.
    - When returning to the primary checkout, reactivate the primary checkout in Serena.

    Tooling rules:
    - Superpowers owns development workflow and verification.
    - Frontend Design owns frontend visual quality.
    - Context7 is preferred for current library/framework documentation.
    - Serena is preferred for semantic code navigation and symbol-aware edits.
    - Use Playwright CLI skills for browser/frontend validation when a runnable local frontend exists.
    - Use project-local package-manager, lint, formatting and test versions when the repository defines them.
    - Use the preinstalled OpenJDK 25, Maven and Gradle for Java projects.
