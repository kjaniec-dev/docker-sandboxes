schemaVersion: "2"
kind: sandbox
name: junie-sbx
version: "1.0.0"
displayName: Junie SBX
description: Development defaults for Junie CLI in Docker Sandboxes

args:
  harness_root:
    required: true
  skills_root:
    required: true

environment:
  variables:
    HARNESS_ROOT: ${{ kit.args.harness_root }}
    SHARED_SKILLS_ROOT: ${{ kit.args.skills_root }}

setup:
  install:
    - command: 'bash "$HARNESS_ROOT/harnesses/junie/scripts/bootstrap.sh"'
      user: "1000"
      description: Configure integrations and shared skills

sandbox:
  image: junie-sbx:local
  entrypoint: ['${{ kit.args.harness_root }}/harnesses/junie/scripts/run.sh']

permissions:
  network:
    allow:
      - github.com
      - api.github.com
      - raw.githubusercontent.com
      - objects.githubusercontent.com
      - codeload.github.com
      - registry.npmjs.org
      - nodejs.org
      - go.dev
      - proxy.golang.org
      - sum.golang.org
      - pypi.org
      - files.pythonhosted.org
      - astral.sh
      - mcp.context7.com
      - cdn.playwright.dev
      - playwright.download.prss.microsoft.com
      - junie.jetbrains.com
      - registry.jetbrains.team
      - api.jetbrains.com
      - account.jetbrains.com
      - oauth.account.jetbrains.com
      # Junie inference gateway and JetBrains runtime resources.
      - ingrazzio-cloud-prod.labs.jb.gg
      - resources.jetbrains.com
      - api.openai.com
      - auth.openai.com
      - api.anthropic.com
      - generativelanguage.googleapis.com
      - api.x.ai
      - openrouter.ai
      - api.openrouter.ai

agentInstructions:
  filename: AGENTS.md
  content: |
    This Junie sandbox directly mounts the host Git repository read/write.

    Worktree rules:
    - Use project-local `.worktrees/`.
    - Verify `.worktrees/` is ignored by Git before creating a worktree.
    - Prefer native worktree capability when available; otherwise use `git worktree`.
    - Never create a sibling worktree outside the mounted repository.
    - When switching worktrees, activate that worktree path in Serena before semantic reads or edits.
    - When returning to the primary checkout, reactivate the primary checkout in Serena.

    Public repository safety:
    - Do not commit credentials, API keys, tokens, agent session state or machine-specific paths.
    - Keep generated images, caches and local configuration out of version control.

    Tooling rules:
    - Use repository-local package-manager, lint, formatting and test versions when defined.
    - Verify changes with project-relevant checks before reporting completion.
    - Use the preinstalled `playwright-cli` for browser automation, screenshots and frontend validation when a runnable local frontend exists.
    - Prefer repository Playwright scripts and configuration when defined; otherwise run `playwright-cli` directly.
    - Use the preinstalled OpenJDK 25, Maven and Gradle for Java projects.
