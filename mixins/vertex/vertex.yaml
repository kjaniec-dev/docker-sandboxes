# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Claude Vertex AI access
description: Runtime egress and guidance for Claude Code running through Google Vertex AI.
kind: mixin
version: "1.0.0"

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - aiplatform.googleapis.com:443
          - "*.aiplatform.googleapis.com:443"
          - aiplatform.eu.rep.googleapis.com:443
          - aiplatform.us.rep.googleapis.com:443

  - type: com.docker.sandbox/agent-context@1
    config:
      content: |
        This Claude Code sandbox uses Google Vertex AI as its model backend.
        Authentication is supplied by the host's native SBX secret proxy.
        ANTHROPIC_AUTH_TOKEN contains only a public placeholder. Do not mount or
        read ADC, run Google authentication, or create service-account keys here.
